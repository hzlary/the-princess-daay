<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>

  setInterval(() => {
    confetti({
      particleCount: 2,
      angle: 60,
      spread: 55,
      origin: { x: 0 },
      colors: ['#f7dee4', '#6a2a44', '#b1493a'] // نفس ألوان الواجهة لديك

      angle: 120,

      colors: ['#f7dee4', '#6a2a44', '#b1493a']
    });
  }, 400);
</script>
